name: Release

# Publishes with npm trusted publishing. Do not set NPM_TOKEN: a stored token
# overrides the GitHub OIDC credential, and the secapi-mcp token expired on
# October 12, 2026.
#
# One-time setup, as the npm user that owns secapi-mcp:
#   https://www.npmjs.com/package/secapi-mcp/access
#   Trusted Publisher → GitHub Actions
#   Organization or user: secapi-dev
#   Repository: secapi-mcp
#   Workflow filename: release.yml
#   Environment: leave empty
#   Allowed actions: npm publish
# npm stage publish alone cannot run `npm publish`.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
